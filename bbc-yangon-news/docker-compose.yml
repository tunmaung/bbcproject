version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bbc-yangon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: bbc_yangon
      MYSQL_USER: bbc_user
      MYSQL_PASSWORD: bbc_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: bbc-yangon-app
    environment:
      DATABASE_URL: mysql://bbc_user:bbc_password@mysql:3306/bbc_yangon
      NODE_ENV: development
      JWT_SECRET: your-secret-key-here
      VITE_APP_ID: your-app-id
      OAUTH_SERVER_URL: https://api.manus.im
      VITE_OAUTH_PORTAL_URL: https://portal.manus.im
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mysql_data:
