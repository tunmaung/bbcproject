name: Deploy BBC Yangon News

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true

          script: |
            set -e

            echo "=================================="
            echo "BBC Yangon News Deployment"
            echo "=================================="

            git config --global --add safe.directory "${{ secrets.PROJECT_PATH }}"

            cd "${{ secrets.PROJECT_PATH }}"

            echo "Current Directory:"
            pwd

            echo "Pull latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Node Version:"
            node -v

            echo "PNPM Version:"
            pnpm --version

            echo "Install dependencies..."
            pnpm install --frozen-lockfile

            echo "Build project..."
            pnpm run build

            echo "Reload PM2..."
            pm2 reload bbc-yangon-news --update-env

            echo "Deployment Successful!"
