name: BBC Yangon News - Professional CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production"
        required: true
        default: true
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: bbc-yangon-news
  NODE_VERSION: "22"
  PNPM_VERSION: "10.4.1"
  PM2_APP: bbc-yangon-news
  HEALTH_URL: https://127.0.0.1:3001/api/trpc/system.health?input=%7B%22json%22%3A%7B%22timestamp%22%3A0%7D%7D

jobs:

  # ============================================================
  # 01 • CHECKOUT
  # ============================================================

  checkout:
    name: "01 • Checkout"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          set -e

          echo "=============================================="
          echo "01 • CHECKOUT"
          echo "=============================================="

          pwd
          git rev-parse --short HEAD
          git branch --show-current

          echo ""
          echo "Repository:"
          ls -la

          echo ""
          echo "Application:"
          ls -la "${APP_DIR}"

  # ============================================================
  # 02 • ENVIRONMENT
  # ============================================================

  environment:
    name: "02 • Environment"
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.APP_DIR }}/pnpm-lock.yaml

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Environment information
        run: |
          set -e

          echo "=============================================="
          echo "02 • ENVIRONMENT"
          echo "=============================================="

          echo "Node:"
          node --version

          echo "PNPM:"
          pnpm --version

          echo "NPM:"
          npm --version

          echo ""
          echo "Application:"
          test -f "${APP_DIR}/package.json"
          test -f "${APP_DIR}/pnpm-lock.yaml"

          echo "package.json ........ OK"
          echo "pnpm-lock.yaml ...... OK"

  # ============================================================
  # 03 • INSTALL DEPENDENCIES
  # ============================================================

  install:
    name: "03 • Install Dependencies"
    runs-on: ubuntu-latest
    needs: environment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.APP_DIR }}/pnpm-lock.yaml

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e

          echo "=============================================="
          echo "03 • INSTALL DEPENDENCIES"
          echo "=============================================="

          pnpm install --frozen-lockfile

  # ============================================================
  # 04 • CODE QUALITY
  # ============================================================

  quality:
    name: "04 • Code Quality"
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.APP_DIR }}/pnpm-lock.yaml

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Code quality
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e

          echo "=============================================="
          echo "04 • CODE QUALITY"
          echo "=============================================="

          if pnpm run lint --if-present; then
            echo "Lint ................. PASS"
          else
            echo "Lint ................. FAILED"
            exit 1
          fi

          if pnpm run format:check --if-present; then
            echo "Format ............... PASS"
          else
            echo "Format ............... FAILED"
            exit 1
          fi

  # ============================================================
  # 05 • TYPE CHECK
  # ============================================================

  typecheck:
    name: "05 • Type Check"
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.APP_DIR }}/pnpm-lock.yaml

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: ${{ env.APP_DIR }}
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: |
          set -e

          echo "=============================================="
          echo "05 • TYPE CHECK"
          echo "=============================================="

          pnpm run check

  # ============================================================
  # 06 • TESTS
  # ============================================================

  tests:
    name: "06 • Tests"
    runs-on: ubuntu-latest
    needs:
      - quality
      - typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.APP_DIR }}/pnpm-lock.yaml

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: ${{ env.APP_DIR }}
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: |
          set -e

          echo "=============================================="
          echo "06 • TESTS"
          echo "=============================================="

          pnpm test --if-present --run

  # ============================================================
  # 07 • SECURITY AUDIT
  # ============================================================

  security:
    name: "07 • Security Audit"
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.APP_DIR }}/pnpm-lock.yaml

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Security audit
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e

          echo "=============================================="
          echo "07 • SECURITY AUDIT"
          echo "=============================================="

          echo "Running production dependency audit..."

          pnpm audit --prod --audit-level=critical

          echo ""
          echo "Security audit ........ PASS"

  # ============================================================
  # 08 • BUILD
  # ============================================================

  build:
    name: "08 • Build Application"
    runs-on: ubuntu-latest
    needs:
      - tests
      - security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.APP_DIR }}/pnpm-lock.yaml

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: |
          set -e

          echo "=============================================="
          echo "08 • BUILD APPLICATION"
          echo "=============================================="

          pnpm run build

          test -f dist/index.js
          test -f dist/public/index.html

          echo ""
          echo "Backend build ........ PASS"
          echo "Frontend build ....... PASS"

  # ============================================================
  # 09 • BUILD VERIFICATION
  # ============================================================

  verify-build:
    name: "09 • Build Verification"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.APP_DIR }}/pnpm-lock.yaml

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Verify build
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e

          echo "=============================================="
          echo "09 • BUILD VERIFICATION"
          echo "=============================================="

          test -d dist
          test -d dist/public
          test -f dist/index.js
          test -f dist/public/index.html

          echo ""
          echo "dist/ ................ OK"
          echo "dist/index.js ........ OK"
          echo "dist/public .......... OK"

  # ============================================================
  # 10 • PACKAGE
  # ============================================================

  package:
    name: "10 • Package Artifact"
    runs-on: ubuntu-latest
    needs: verify-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.APP_DIR }}/pnpm-lock.yaml

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: pnpm run build

      - name: Create artifact
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e

          echo "=============================================="
          echo "10 • PACKAGE ARTIFACT"
          echo "=============================================="

          tar \
            --exclude='node_modules' \
            --exclude='backups' \
            -czf ../bbc-yangon-news-build.tar.gz \
            dist package.json pnpm-lock.yaml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbc-yangon-news-build
          path: bbc-yangon-news-build.tar.gz
          retention-days: 7

  # ============================================================
  # 11 • PRODUCTION BACKUP
  # ============================================================

  backup:
    name: "11 • Production Backup"
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Production backup
        run: |
          set -e

          echo "=============================================="
          echo "11 • PRODUCTION BACKUP"
          echo "=============================================="

          echo "Backup stage ready."
          echo "Production backup will be executed on the server"
          echo "before the deployment stage."

  # ============================================================
  # 12 • DEPLOY
  # ============================================================

  deploy:
    name: "12 • Deploy Production"
    runs-on: ubuntu-latest
    needs:
      - backup
      - package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bbc-yangon-news-build

      - name: Show deployment package
        run: |
          set -e

          echo "=============================================="
          echo "12 • DEPLOY PRODUCTION"
          echo "=============================================="

          ls -lh bbc-yangon-news-build.tar.gz

      - name: Deployment notice
        run: |
          echo "Production deployment stage reached."
          echo "Server-side deployment must be connected"
          echo "through your existing deployment mechanism."

  # ============================================================
  # 13 • PM2 RELOAD
  # ============================================================

  pm2:
    name: "13 • PM2 Reload"
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: PM2 stage
        run: |
          echo "=============================================="
          echo "13 • PM2 RELOAD"
          echo "=============================================="

          echo "PM2 reload stage ready."

  # ============================================================
  # 14 • HEALTH CHECK
  # ============================================================

  health:
    name: "14 • Health Check"
    runs-on: ubuntu-latest
    needs: pm2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Health check
        run: |
          set -e

          echo "=============================================="
          echo "14 • HEALTH CHECK"
          echo "=============================================="

          echo "Production health-check stage ready."

  # ============================================================
  # 15 • SMOKE TEST
  # ============================================================

  smoke:
    name: "15 • Smoke Test"
    runs-on: ubuntu-latest
    needs: health
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Smoke test
        run: |
          set -e

          echo "=============================================="
          echo "15 • SMOKE TEST"
          echo "=============================================="

          echo "Smoke test stage ready."

  # ============================================================
  # 16 • DEPLOYMENT VERIFICATION
  # ============================================================

  verify-production:
    name: "16 • Production Verification"
    runs-on: ubuntu-latest
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Verify production
        run: |
          set -e

          echo "=============================================="
          echo "16 • PRODUCTION VERIFICATION"
          echo "=============================================="

          echo "Production verification stage ready."

  # ============================================================
  # 17 • ROLLBACK
  # ============================================================

  rollback:
    name: "17 • Automatic Rollback"
    runs-on: ubuntu-latest
    needs:
      - deploy
      - pm2
      - health
      - smoke
      - verify-production

    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (
        needs.deploy.result == 'failure' ||
        needs.pm2.result == 'failure' ||
        needs.health.result == 'failure' ||
        needs.smoke.result == 'failure' ||
        needs.verify-production.result == 'failure'
      )

    steps:
      - name: Rollback
        run: |
          echo "=============================================="
          echo "17 • AUTOMATIC ROLLBACK"
          echo "=============================================="

          echo "Deployment failed."
          echo "Rollback stage activated."

          echo ""
          echo "IMPORTANT:"
          echo "Run the existing server rollback script:"
          echo ""
          echo "cd /home/ubuntu/bbcproject/bbc-yangon-news"
          echo "./scripts/rollback.sh"

  # ============================================================
  # 18 • DEPLOYMENT SUMMARY
  # ============================================================

  summary:
    name: "18 • Deployment Summary"
    runs-on: ubuntu-latest
    needs:
      - checkout
      - environment
      - install
      - quality
      - typecheck
      - tests
      - security
      - build
      - verify-build
      - package
      - backup
      - deploy
      - pm2
      - health
      - smoke
      - verify-production
      - rollback

    if: always()

    steps:
      - name: Summary
        run: |
          echo ""
          echo "================================================"
          echo "       BBC YANGON NEWS CI/CD SUMMARY"
          echo "================================================"
          echo ""
          echo "01  Checkout"
          echo "02  Environment"
          echo "03  Install Dependencies"
          echo "04  Code Quality"
          echo "05  Type Check"
          echo "06  Tests"
          echo "07  Security Audit"
          echo "08  Build Application"
          echo "09  Build Verification"
          echo "10  Package Artifact"
          echo "11  Production Backup"
          echo "12  Deploy Production"
          echo "13  PM2 Reload"
          echo "14  Health Check"
          echo "15  Smoke Test"
          echo "16  Production Verification"
          echo "17  Automatic Rollback"
          echo "18  Deployment Summary"
          echo ""
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          echo ""
          echo "================================================"
